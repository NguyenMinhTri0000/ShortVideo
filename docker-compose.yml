services:
  postgres:
    image: postgres:15-alpine
    container_name: videotool-postgres
    ports:
      - "25432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: videotool
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: videotool-redis
    ports:
      - "26379:6379"
    volumes:
      - redis_data:/data
    restart: always

  minio:
    image: minio/minio
    container_name: videotool-minio
    ports:
      - "29000:9000"
      - "29001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: videotool-backend
    network_mode: "host"
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:25432/videotool?schema=public"
      REDIS_HOST: "127.0.0.1"
      REDIS_PORT: 26379
      MINIO_ENDPOINT: "127.0.0.1"
      MINIO_PORT: 29000
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_ENDPOINT: "127.0.0.1"
      MINIO_PUBLIC_PORT: 29000
      MINIO_PUBLIC_USE_SSL: "false"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET_NAME: "videos"
      PORT: 23001
      YOUTUBE_CLIENT_ID: ""
      YOUTUBE_CLIENT_SECRET: ""
    volumes:
      - ./engine:/app/engine
      - ./storage:/app/storage
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: videotool-frontend
    network_mode: "host"
    depends_on:
      - backend
    environment:
      API_UPSTREAM: "http://127.0.0.1:23001"
      MEDIA_PROXY_ALLOWED_HOSTS: "127.0.0.1:29000,localhost:29000,minio:9000"
      MEDIA_PROXY_ALLOWED_PATH_PREFIXES: "/videos/"
    restart: always

volumes:
  postgres_data:
  redis_data:
  minio_data:
